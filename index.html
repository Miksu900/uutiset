<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uutiset</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font:16px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;background:#111;padding:12px;border-bottom:1px solid #222;z-index:1}
h1{margin:0 0 8px;font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button,select,input{font:inherit;color:#fff;background:#222;border:0;border-radius:16px;padding:8px 14px}
button.on{background:#2a5db0}
input{flex:1;min-width:120px;border-radius:8px}
select{border-radius:8px}
main{padding:8px 12px 40px;max-width:800px;margin:auto}
a.card{display:block;background:#1b1b1b;border-radius:10px;padding:12px 14px;margin:8px 0;color:#fff;text-decoration:none}
.meta{color:#999;font-size:12px}
.t{margin-top:4px}
#st{color:#999;font-size:12px;padding:8px 0}
</style></head><body>
<header>
<h1>Uutiset</h1>
<div class="row" id="chips"></div>
<div class="row" style="margin-top:8px"><input id="q" placeholder="Hae…"><select id="src"><option value="">Kaikki lähteet</option></select></div>
</header>
<main><div id="st">Ladataan…</div><div id="list"></div></main>
<script>
const URL_="https://arwenhbwzoavbonlwkdr.supabase.co", KEY="sb_publishable_7baeuteHYaarCEv4-j8C_g_OLxcKzJp";
const TOPICS=[["all","Kaikki"],["israel","Israel"],["mid_east","Lähi-itä"],["islam","Islam"],["finland","Suomi"]];
let topic="all", items=[];
const $=id=>document.getElementById(id);
function chips(){$("chips").innerHTML="";TOPICS.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.className=k===topic?"on":"";b.onclick=()=>{topic=k;chips();load()};$("chips").appendChild(b)})}
function ago(d){const m=Math.round((Date.now()-new Date(d))/6e4);if(m<1)return"nyt";if(m<60)return m+" min sitten";const h=Math.round(m/60);if(h<24)return h+" h sitten";return new Date(d).toLocaleDateString("fi-FI")}
function render(){
  const q=$("q").value.toLowerCase(), s=$("src").value;
  const rows=items.filter(a=>(!s||a.source===s)&&(!q||a.title.toLowerCase().includes(q)));
  $("st").textContent=rows.length+" uutista · päivittyy minuutin välein";
  $("list").innerHTML="";
  rows.forEach(a=>{const e=document.createElement("a");e.className="card";e.href=a.url;e.target="_blank";e.rel="noopener";
    const m=document.createElement("div");m.className="meta";m.textContent=a.source+" · "+ago(a.published_at);
    const t=document.createElement("div");t.className="t";t.textContent=a.title;e.append(m,t);$("list").appendChild(e)});
}
async function load(){
  try{
    let u=URL_+"/rest/v1/articles?select=*&order=published_at.desc&limit=300";
    if(topic!=="all")u+="&topics=cs."+encodeURIComponent("{"+topic+"}");
    const r=await fetch(u,{headers:{apikey:KEY}});
    if(!r.ok)throw new Error(r.status);
    items=await r.json();
    const cur=$("src").value, names=[...new Set(items.map(a=>a.source))].sort();
    $("src").innerHTML='<option value="">Kaikki lähteet</option>'+names.map(n=>`<option${n===cur?" selected":""}>${n}</option>`).join("");
    render();
  }catch(e){$("st").textContent="Lataus epäonnistui: "+e.message}
}
$("q").oninput=render;$("src").onchange=render;
chips();load();setInterval(load,60000);
</script></body></html>
